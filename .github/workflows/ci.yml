name: Argus CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort mypy pytest

      - name: Run black
        run: black --check argus/ scripts/

      - name: Run isort
        run: isort --check-only argus/ scripts/

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://argus:argus@localhost:5432/argus
          JWT_SECRET: ci-test-secret
          PYTORCH_ENABLE_MPS_FALLBACK: "1"
        run: pytest argus/tests/ -v --tb=short

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argus-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: argus-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          REACT_APP_API_URL: http://localhost:8000
          CI: false
        run: npm run build
